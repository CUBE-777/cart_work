<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIPLE A — Digital Solutions</title>
<meta name="description" content="Triple A: web, design, animation, video and branding.">
<link rel="icon" href="assets/icons/favicon.png" type="image/png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs></svg>
<div id="pre" aria-hidden="true"><img src="assets/logo/logo.png" alt="" width="72" height="60"></div>
<header class="bar">
  <a href="#top" class="brand"><img data-logo alt="" width="34" height="28"><span data-brand></span></a>
  <nav id="nav" aria-label="Main"></nav>
  <div class="tools">
    <div id="langs" role="group" aria-label="Language"></div>
    <button id="theme" class="ic" aria-label="Theme">◐</button>
    <button id="menu" class="ic" aria-label="Menu" aria-expanded="false">≡</button>
  </div>
</header>
<main id="top">
  <section class="hero wrap">
    <img data-logo class="logo" alt="Triple A" width="110" height="92">
    <h1 data-brand></h1>
    <p class="tag" id="tagline"></p>
    <p class="desc" id="desc"></p>
    <div class="acts" id="acts"></div>
    <div class="soc" data-socials></div>
  </section>
  <section id="services" class="wrap"><h2 data-t="nav.services"></h2><div class="grid" id="svc"></div></section>
  <section id="portfolio" class="wrap"><h2 data-t="nav.portfolio"></h2><div class="grid p" id="pf"></div></section>
  <section id="about" class="wrap"><h2 data-t="nav.about"></h2><p class="lead" id="about-t"></p></section>
  <section id="contact" class="wrap"><h2 data-t="nav.contact"></h2>
    <div class="acts" id="acts2"></div>
    <div class="soc" data-socials></div>
    <form id="form" hidden><input name="n" required data-ph="ui.name"><textarea name="m" rows="4" required data-ph="ui.message"></textarea><button class="btn pri" data-t="ui.send"></button></form>
  </section>
</main>
<footer class="wrap foot">
  <b data-brand></b><p data-t="ui.footer"></p><div class="soc" data-socials></div>
  <p class="links" id="flinks"></p><p data-t="ui.rights"></p><p data-t="ui.made"></p>
</footer>
<a id="wa" class="fab" aria-label="WhatsApp"></a>
<script src="data.js"></script><script src="script.js"></script>
</body></html>
